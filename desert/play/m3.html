<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* The ratified v1.0 experience is the pack booted with these three flags:
   char=1 (the figure), clips=1 (its hybrid idle), audio=1 (the generative OST).
   A shared link cannot be trusted to carry a fragment, so this launcher carries it.
   DO NOT add a skin flag: the wireframe skeleton IS the ratified look
   (sand-bending tag video-2026-08-11-skeleton-ost).

   Before it hands over, the launcher asks the browser for a WebGPU adapter. A browser without
   one used to get the pack's WebGL2 fallback, which fails its shaders and leaves a black screen
   with no message (seen 2026-11-12 in a headless phone browser). Now that browser is told
   plainly what to do instead. A touch-only device that does have WebGPU (a phone or tablet with
   a recent browser) is told the game is played with a keyboard, and can still start it.
   A new launcher is a copy of this file with TARGET changed (plus the two fallbacks below). */
var TARGET = "m3-pack.html#char=1&clips=1&audio=1";
</script>
<noscript><meta http-equiv="refresh" content="0;url=m3-pack.html#char=1&amp;clips=1&amp;audio=1"></noscript>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0906">
<title>Gote Desert v1.0</title>
<style>
  :root {
    --ground: #0b0906; --ground-2: #120d09; --panel: #17110b; --panel-2: #1e1710;
    --rule: #2e2519; --rule-hot: #55401f; --ink: #f6efe3; --ink-2: #baab93; --ink-3: #83765f;
    --sun: #e8a552; --sun-hot: #ffc47e;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0d0b08; }
  body { color: #cbb289; font: 15px/1.6 var(--mono); }
  a { color: var(--sun); }
  .boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center; margin: 0; }

  .msg { max-width: 30rem; margin: 0 auto; padding: 1.4rem 1.1rem 3rem; display: flex; flex-direction: column; gap: 1rem;
         font-family: var(--sans); color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .msg[hidden], .boot[hidden] { display: none; }
  .hud { font-family: var(--mono); font-size: .68rem; letter-spacing: .22em; text-transform: uppercase;
         color: var(--sun); border-bottom: 1px solid var(--rule); padding-bottom: .75rem; }
  .shot { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; display: block; border-radius: 12px;
          border: 1px solid var(--rule-hot); background: var(--ground-2); }
  h1 { font-size: clamp(1.6rem, 6.6vw, 2.1rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.08; margin: .3rem 0 0; text-wrap: balance; }
  p { margin: 0; color: var(--ink-2); font-size: 1rem; }
  .actions { display: flex; flex-direction: column; gap: .6rem; margin-top: .4rem; }
  .start { display: flex; align-items: center; justify-content: space-between; gap: 1rem; text-decoration: none; border: 0; cursor: pointer;
           background: var(--sun); color: #1a1206; border-radius: 10px; padding: .9rem 1.15rem; width: 100%;
           font-family: var(--mono); font-size: .86rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .start:hover, .start:focus-visible { background: var(--sun-hot); }
  .start:focus-visible { outline: 2px solid var(--sun-hot); outline-offset: 3px; }
  .ghost { display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink-2); background: none; cursor: pointer;
           border: 1px solid var(--rule-hot); border-radius: 10px; padding: .85rem 1rem; width: 100%;
           font-family: var(--mono); font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; }
  .ghost:hover, .ghost:focus-visible { color: var(--ink); border-color: var(--sun); background: var(--panel-2); }
  .ghost:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
  .ghost[hidden], .start[hidden] { display: none; }
  .send-panel { display: flex; gap: .5rem; border: 1px dashed var(--rule-hot); border-radius: 10px; padding: .7rem; }
  .send-panel[hidden] { display: none; }
  .send-panel .ghost { padding: .7rem .3rem; font-size: .7rem; }
  .req { font-family: var(--mono); font-size: .7rem; color: var(--ink-3); letter-spacing: .04em; }
  .req b { color: var(--ink-2); }
</style>
</head>
<body>
<p class="boot" id="boot">Starting Gote Desert v1.0.<br><a id="continue" href="m3-pack.html#char=1&amp;clips=1&amp;audio=1">Continue</a></p>

<main class="msg" id="msg" hidden>
  <div class="hud">Gote Desert</div>
  <img class="shot" src="/media/gote-desert-loop.jpg" alt="Gote Desert: a hole dug into the sand" width="540" height="540">
  <h1 id="msg-h"></h1>
  <p id="msg-p"></p>
  <div class="actions">
    <button class="start" type="button" id="send" aria-controls="send-panel" aria-expanded="false"><span>Send it to my computer</span><span aria-hidden="true">&#9656;</span></button>
    <div class="send-panel" id="send-panel" hidden>
      <a class="ghost" href="mailto:?subject=Gote%20Desert&amp;body=Gote%20Desert%2C%20to%20play%20on%20my%20computer%20in%20Chrome%20or%20Edge%3A%20https%3A%2F%2Fgamegote.com%2F">Email it</a>
      <a class="ghost" href="sms:?&amp;body=Gote%20Desert%2C%20to%20play%20on%20my%20computer%3A%20https%3A%2F%2Fgamegote.com%2F">Text it</a>
      <button class="ghost" type="button" data-copy>Copy link</button>
    </div>
    <button class="start" type="button" id="copy-main" data-copy hidden><span>Copy the link</span><span aria-hidden="true">&#9656;</span></button>
    <a class="ghost" id="anyway" href="m3-pack.html#char=1&amp;clips=1&amp;audio=1" hidden>Start it here anyway</a>
    <a class="ghost" href="/">Back to gamegote.com</a>
  </div>
  <p class="req">Or type <b>gamegote.com</b> on a computer.</p>
</main>

<script>
(function () {
  var LINK = 'https://gamegote.com/';
  var touch = !!(window.matchMedia && matchMedia('(hover: none) and (pointer: coarse)').matches);

  function go() { location.replace(TARGET); }

  var COPY = {
    noTouch: ['This browser cannot start Gote Desert',
              'The game draws with WebGPU, and this browser has not made it available. Open gamegote.com in Chrome or Edge on a computer. Already in Chrome or Edge? Turn on hardware acceleration in its settings, restart it, and press play again.'],
    noPhone: ['Gote Desert plays on a computer',
              'This browser cannot run it: the game needs WebGPU and a keyboard. Send yourself the link, open it in Chrome or Edge on a computer, and it starts in one click.'],
    keys:    ['Gote Desert is played with a keyboard',
              'It plays on a computer, in Chrome or Edge. Send yourself the link and pick it up there. If you do have a keyboard connected, you can start it here.']
  };

  function show(kind) {
    var c = COPY[kind];
    document.getElementById('msg-h').textContent = c[0];
    document.getElementById('msg-p').textContent = c[1];
    document.getElementById('boot').hidden = true;
    document.getElementById('msg').hidden = false;
    if (kind === 'noTouch') {
      document.getElementById('send').hidden = true;
      document.getElementById('copy-main').hidden = false;
    }
    if (kind === 'keys') document.getElementById('anyway').hidden = false;
    document.title = 'Gote Desert plays on a computer';
  }

  // Send it to my computer: the share sheet if there is one, else email, text or copy. Nothing is stored.
  var send = document.getElementById('send'), panel = document.getElementById('send-panel');
  send.addEventListener('click', function () {
    function toggle() { panel.hidden = !panel.hidden; send.setAttribute('aria-expanded', String(!panel.hidden)); }
    if (navigator.share) {
      navigator.share({ title: 'Gote Desert', text: 'Gote Desert, to play on my computer in Chrome or Edge:', url: LINK })
        .catch(function (err) { if (!err || err.name !== 'AbortError') toggle(); });
    } else { toggle(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'), function (b) {
    var label = b.querySelector('span') || b, base = label.textContent;
    function done(ok) { label.textContent = ok ? 'Copied' : 'gamegote.com'; setTimeout(function () { label.textContent = base; }, 2200); }
    function fallback() {
      var t = document.createElement('textarea'); t.value = LINK; t.setAttribute('readonly', '');
      t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t); done(ok);
    }
    b.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(LINK).then(function () { done(true); }, fallback);
      else fallback();
    });
  });

  // The check. A browser that never answers within 4 s is handed to the game, which has its own fatal path.
  if (!navigator.gpu) { show(touch ? 'noPhone' : 'noTouch'); return; }
  var settled = false;
  var timer = setTimeout(function () { if (!settled) { settled = true; go(); } }, 4000);
  navigator.gpu.requestAdapter().then(function (adapter) {
    if (settled) return; settled = true; clearTimeout(timer);
    if (!adapter) show(touch ? 'noPhone' : 'noTouch');
    else if (touch) show('keys');
    else go();
  }, function () {
    if (settled) return; settled = true; clearTimeout(timer);
    show(touch ? 'noPhone' : 'noTouch');
  });
})();
</script>
</body>
</html>
